<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Search</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
            }
            .search-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 20px;
            }
            .search-bar {
                width: 500px;
                padding: 10px;
                border-radius: 24px;
                border: 1px solid #dfe1e5;
                margin-bottom: 20px;
            }
            .buttons {
                display: flex;
                gap: 10px;
            }
            .button {
                padding: 10px 20px;
                border: none;
                background-color: #f8f9fa;
                border-radius: 4px;
                cursor: pointer;
            }
            .button:hover {
                border: 1px solid #dadce0;
            }
            .links {
                position: absolute;
                top: 10px;
                right: 10px;
            }
            .links a {
                margin-left: 10px;
                text-decoration: none;
                color: #1a0dab;
            }
        </style>
    </head>
    <body>
        <div class="links">
            <a href="images.html">Images</a>
            <a href="advanced.html">Advanced Search</a>
        </div>
        <h1>Search</h1>
        <form action="https://google.com/search">
            <div class="search-container">
                <input type="text" name="q" class="search-bar">
                <input type="submit" value="Google Search" class="button">
                <input type="submit" value="I'm Feeling Lucky" class="button" name="btnI">
            </div>
        </form>
    </body>
</html>
